name: k-Orientations focused Lean check
on:
  push:
    branches:
      - application/k-orientations-d-closures-20261012
    paths:
      - 'AllThoseEPPA/Applications/KOrientations/**'
      - 'AllThoseEPPA/Applications/KOrientations.lean'
      - '.github/workflows/k-orientations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k-orientations-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundational-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download targeted Mathlib cache
        run: |
          lake exe cache get \
            Mathlib.Data.Fintype.EquivFin \
            Mathlib.Data.Finset.Card \
            Mathlib.Data.Set.Finite.Basic \
            Mathlib.Algebra.Group.PUnit \
            Mathlib.GroupTheory.Perm.Basic \
            Mathlib.Data.Fin.Basic \
            Mathlib.Data.Set.Basic
      - name: Build orientation foundational modules in order
        run: |
          set -euxo pipefail
          lake build AllThoseEPPA.Applications.KOrientations.Graph
          lake build AllThoseEPPA.Applications.KOrientations.Closures
          lake build AllThoseEPPA.Applications.KOrientations.ClosureMinimal
          lake build AllThoseEPPA.Applications.KOrientations.Encoding
          lake build AllThoseEPPA.Applications.KOrientations.StructureBridge
          lake build AllThoseEPPA.Applications.KOrientations.ClosedSubstructures
          lake build AllThoseEPPA.Applications.KOrientations.AuxiliaryLanguage
          lake build AllThoseEPPA.Applications.KOrientations.FaithfulLocalTransfer
          lake build AllThoseEPPA.Applications.KOrientations.PatternTransport
          lake build AllThoseEPPA.Applications.KOrientations.SuccessorFaithfulGraph
          lake build AllThoseEPPA.Applications.KOrientations.SuccessorFaithfulFunctions
          # The previously checked FirstWitness imports the full main theorem facade;
          # its continued regression coverage is provided by the standard full Lean CI.
