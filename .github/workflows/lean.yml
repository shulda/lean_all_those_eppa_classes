name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the two explicit caches used in Jan Hubička's
      # partite-construction repository.  They make the cache policy visible
      # and predictable instead of relying only on lean-action defaults.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Keep the useful parts of Jan Hubička's cache strategy: the Lean
      # toolchain is cached above and compiled Mathlib artifacts are fetched
      # selectively below.  We intentionally do not cache the complete .lake
      # workspace: measured archives were about 2.58 GB per commit and their
      # restore/save time dominated this small project's CI.
      - name: Download Mathlib cache
        run: |
          lake exe cache get \
            Mathlib.Data.Fintype.Sort \
            Mathlib.Data.Fintype.Pi \
            Mathlib.Data.Fintype.Sigma \
            Mathlib.Logic.Equiv.Fintype \
            Mathlib.Logic.Equiv.PartialEquiv \
            Mathlib.GroupTheory.Perm.Basic \
            Mathlib.Combinatorics.SimpleGraph.Basic

      - name: Build and audit Lean project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          use-github-cache: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: AllThoseEPPA
          axiom-audit-allow: propext,Classical.choice,Quot.sound
