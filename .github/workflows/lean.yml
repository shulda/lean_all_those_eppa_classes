name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the two explicit caches used in Jan Hubička's
      # partite-construction repository.  They make the cache policy visible
      # and predictable instead of relying only on lean-action defaults.
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # As in Jan Hubička's partite-construction workflow, fetch only the
      # Mathlib cache roots that this project currently imports instead of the
      # complete Mathlib cache.
      - name: Download Mathlib cache
        run: |
          lake exe cache get \
            Mathlib.Data.Fintype.Sort \
            Mathlib.Logic.Equiv.Fintype \
            Mathlib.Logic.Equiv.PartialEquiv \
            Mathlib.GroupTheory.Perm.Basic \
            Mathlib.Combinatorics.SimpleGraph.Basic

      - name: Build and audit Lean project
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: true
          use-github-cache: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: AllThoseEPPA
          axiom-audit-allow: propext,Classical.choice,Quot.sound
